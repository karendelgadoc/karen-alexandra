name: Deploy to production

# Every push to main deploys the site. Also runnable by hand from the
# Actions tab (workflow_dispatch) if you need to re-deploy without a commit.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two deploys race. A newer push waits for the running one to
# finish rather than cancelling it, so a half-uploaded deploy can't win.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Gate: type-check and compile before shipping. If this fails the deploy
      # step never runs, so code that doesn't build can't reach the live site.
      - name: Build
        run: npm run build

      # The CLI uploads the working directory; node_modules, .git and .next are
      # excluded by its own defaults, and .vercelignore covers the rest. The
      # uploads.zip dance isn't needed here — that file is gitignored, so a
      # fresh CI checkout never has it.
      # `login` is required: the deploy command's auth check reads the
      # credentials file (~/.insforge/credentials.json), not INSFORGE_ACCESS_TOKEN,
      # so setting only the env var still drops it into interactive OAuth — it
      # prints a login URL and blocks for five minutes with nobody there to
      # answer. `login --user-api-key` writes that file, and deploy then finds it.
      - name: Deploy to InsForge
        run: |
          if [ -z "$INSFORGE_ACCESS_TOKEN" ]; then
            echo "::error::INSFORGE_ACCESS_TOKEN is not set. Add it under Settings → Secrets and variables → Actions; the value is a uak_ user API key."
            exit 1
          fi
          npx --yes @insforge/cli@0.2.8 login --user-api-key "$INSFORGE_ACCESS_TOKEN"
          npx --yes @insforge/cli@0.2.8 deployments deploy .
        env:
          INSFORGE_ACCESS_TOKEN: ${{ secrets.INSFORGE_ACCESS_TOKEN }}
          INSFORGE_PROJECT_ID: 920e1f0c-6261-4331-8e7b-aadabd6287ab
